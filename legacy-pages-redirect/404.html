<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flag Game has moved</title>
    <link rel="canonical" href="https://wlad-c.github.io/Hana-s-flag-game/" />
    <meta
      http-equiv="refresh"
      content="0; url=https://wlad-c.github.io/Hana-s-flag-game/"
    />
    <script>
      (function () {
        var NEW_ORIGIN = "https://wlad-c.github.io";
        var GAME = "/Hana-s-flag-game";
        var path = location.pathname || "/";
        var destPath =
          path === "/" || path === ""
            ? GAME + "/"
            : path.indexOf(GAME) === 0
              ? path
              : GAME + (path.charAt(0) === "/" ? path : "/" + path);
        location.replace(NEW_ORIGIN + destPath + location.search + location.hash);
      })();
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Flag Game has moved</h1>
    <p>
      This site is now at
      <a href="https://wlad-c.github.io/Hana-s-flag-game/"
        >https://wlad-c.github.io/Hana-s-flag-game/</a
      >.
    </p>
  </body>
</html>
