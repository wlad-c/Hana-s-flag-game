name: Flag integrity check

# Runs on any PR that touches flag SVGs, the flag overrides, or the check scripts,
# blocking merges that would introduce flags with standardised (wrong) aspect
# ratios OR a subdivision flag that is actually its parent nation's flag.

on:
  pull_request:
    paths:
      - "public/flags/**"
      - "scripts/download-flags.mjs"
      - "scripts/check-flag-proportions.mjs"
      - "scripts/check-parent-flag-collision.mjs"
      - "scripts/check-subdivision-name-collisions.mjs"
      - "scripts/check-flag-image-quality.mjs"
      - "scripts/check-flag-meanings.mjs"
      - "scripts/check-city-flag-meanings.mjs"
      - "scripts/check-political-parties.mjs"
      - "src/data/politicalParties.ts"
      - "public/party-logos/**"
      - "scripts/check-commercial-airlines.mjs"
      - "src/data/commercialAirlines.ts"
      - "public/airline-logos/**"
      - "scripts/check-tourism-logos.mjs"
      - "scripts/check-central-banks.mjs"
      - "src/data/tourismLogos.ts"
      - "public/tourism-logos/**"
      - "scripts/check-national-news-agencies.mjs"
      - "src/data/nationalNewsAgencies.ts"
      - "scripts/check-national-newspapers.mjs"
      - "src/data/nationalNewspapers.ts"
      - "public/newspaper-logos/**"
      - "src/api/subdivisions.ts"
      - "src/lib/subdivisionFlagIndex.ts"
      - "scripts/check-subdivision-flags-bundled.mjs"
      - "src/lib/subdivisionMeta.ts"
      - "src/data/flagMeanings.ts"
      - "src/data/cityFlagMeanings.ts"
      - "public/subdivisions/**"
      - "public/world-subnational-borders.json"
      - "scripts/build-world-subnational-borders.mjs"
      - "scripts/lib/subnational-border-mesh.mjs"
      - "src/lib/worldSubnationalBorders.ts"
      - "scripts/build-subdivision-meta.mjs"
      - "scripts/check-subdivision-meta-coverage.mjs"
      - "public/national-flags/**"
      - "scripts/data/national-flag-sources.json"
      - "scripts/download-national-flags.mjs"
      - "scripts/build-national-flags.mjs"
      - "scripts/check-national-flags.mjs"
      - "scripts/check-football-crest-stats.mjs"
      - "src/data/worldCupRecords.ts"
      - "src/data/worldCupTitles.ts"
      - "src/lib/footballCrestStats.ts"
      - "scripts/seed-national-symbols.mjs"
      - "scripts/harvest-national-symbols.mjs"
      - "src/data/nationalFlags.ts"
      - "public/capital-flags/**"
      - "src/data/capitalFlags.ts"
      - "src/data/sharedCapitalFlags.ts"
      - "src/data/cityTerritories.ts"
      - "scripts/check-capital-flags.mjs"
      - "scripts/check-capital-subdivision-collision.mjs"
      - "scripts/check-identical-subdivision-flags.mjs"
      - "src/data/identicalSubdivisionFlags.ts"
      - "src/hooks/useSubdivisionGame.ts"
      - "scripts/build-capital-details.mjs"
      - "scripts/check-hierarchy-type-colors.mjs"
      # Flag Master's symbol packs — the decks are derived from the national-symbols
      # data above, so a change to either the data or the builders must re-run the gate.
      - "scripts/check-quiz-symbol-decks.mjs"
      - "scripts/check-rsf-press-freedom.mjs"
      - "scripts/data/rsf-press-freedom-2026.csv"
      - "scripts/check-hdi-data.mjs"
      - "scripts/data/hdi2023Data.mjs"
      - "scripts/data/hdr25-hdi-2023.csv"
      - "scripts/check-gggr-data.mjs"
      - "scripts/data/gggr-2026.csv"
      - "scripts/data/gggr2026Data.mjs"
      - "scripts/check-gpi-data.mjs"
      - "scripts/check-visa-access.mjs"
      - "scripts/build-visa-access.mjs"
      - "scripts/data/passport-index-tidy-iso2.csv"
      - "src/data/visaAccess.ts"
      - "src/lib/visaAccessColors.ts"
      - "src/components/PassportMapControl.tsx"
      - "src/components/VisaAccessMapLegend.tsx"
      - "scripts/check-diaspora.mjs"
      - "scripts/build-diaspora.mjs"
      - "scripts/data/diaspora-migrant-stock-2024.csv"
      - "scripts/data/diaspora-migrant-stock-2024.meta.json"
      - "src/data/diaspora.ts"
      - "src/lib/diasporaColors.ts"
      - "src/components/DiasporaMapControl.tsx"
      - "src/components/DiasporaMapLegend.tsx"
      - "scripts/check-fiw-data.mjs"
      - "scripts/build-fiw.mjs"
      - "scripts/data/fiw-2026.csv"
      - "scripts/data/fiw2026Data.mjs"
      - "scripts/check-index-map-colors.mjs"
      - "scripts/check-index-labels.mjs"
      - "scripts/check-index-chart-bands.mjs"
      - "src/lib/democracyColors.ts"
      - "scripts/check-etr-data.mjs"
      - "scripts/data/etr-2024.csv"
      - "scripts/data/etr2024Data.mjs"
      - "scripts/data/gpi-2026.csv"
      - "scripts/data/gpi2026Data.mjs"
      - "scripts/check-gti-data.mjs"
      - "scripts/data/gti-2026.csv"
      - "scripts/data/gti2026Data.mjs"
      - "scripts/check-wjp-rule-of-law.mjs"
      - "scripts/data/wjp-rule-of-law-2025.csv"
      - "scripts/data/wjp-rule-of-law-2024.csv"
      - "scripts/data/wjp2025Data.mjs"
      - "scripts/check-imd-wcr.mjs"
      - "scripts/check-soft-power-data.mjs"
      - "scripts/check-dnr-trust.mjs"
      - "scripts/check-country-blocks.mjs"
      - "scripts/check-wvs-results.mjs"
      - "src/data/wvsResults.json"
      - "src/data/wvsResultsMeta.ts"
      - "src/lib/wvsResults.ts"
      - "scripts/build-country-personas.mjs"
      - "scripts/check-country-personas.mjs"
      - "scripts/lib/personaText.mjs"
      - "scripts/lib/personaLint.mjs"
      - "scripts/data/country-personas-model.json"
      - "scripts/data/country-persona-portraits.json"
      - "scripts/data/country-persona-inputs.json"
      - "src/data/countryPersonas.ts"
      - "src/lib/countryPersonas.ts"
      - "src/components/Persona*.tsx"
      - "src/components/WvsSelectionPicker.tsx"
      - "src/data/countryBlocks.ts"
      - "src/components/DemocracyIndexChart.tsx"
      - "scripts/data/soft-power-2026.csv"
      - "scripts/data/softPower2026Data.mjs"
      - "scripts/data/dnr-trust-2026.csv"
      - "scripts/data/dnr2026Data.mjs"
      - "scripts/data/imd-wcr-2025.csv"
      - "scripts/data/imdWcr2025Data.mjs"
      - "scripts/data/democracyData.mjs"
      - "scripts/check-whr-happiness.mjs"
      - "scripts/check-gdi-data.mjs"
      - "scripts/data/gdi-2024-rankings.json"
      - "scripts/data/gdi2024Data.mjs"
      - "scripts/data/whr-happiness-2026.csv"
      - "scripts/data/whr2026-figure-2.1.xlsx"
      - "scripts/data/whr2026Data.mjs"
      - "src/data/countryFacts.ts"
      - "src/lib/democracyColors.ts"
      - "src/lib/quizSymbols.ts"
      - "src/lib/historicalQuiz.ts"
      - "src/hooks/useGame.ts"
      - "src/hooks/useHistoricalFlagGame.ts"
      - "src/components/SubdivisionHierarchyTable.tsx"
      - "src/pages/LearnPage.css"
      - "src/index.css"
      # Historical-era maps: check-historical-maps.mjs guards their geometry and
      # provenance (no era may be a relabelled copy of another).
      - "public/historical-maps/**"
      - "public/historical-flags/**"
      - "src/lib/historicalEras.ts"
      - "scripts/check-historical-maps.mjs"
      - "scripts/check-historical-flag-anachronism.mjs"
      - "scripts/check-ci-coverage.mjs"
      - "src/data/flagOverlayAspectRatios.ts"
      - "package.json"
      - ".github/workflows/flag-integrity.yml"
      - ".github/workflows/deploy.yml"
      - "src/data/flagAdoptionYears.ts"
      - "scripts/repair-historical-maps.mjs"
      - "scripts/restore-era-geometry.mjs"
      - "scripts/check-era-landmass.mjs"
      - "scripts/build-era-gap-fill.mjs"
      - "scripts/data/era-gap-fill.json"
      - "scripts/check-era-anachronism.mjs"
      - "src/data/polityExistence.ts"
      # A curated era flag is an image with a DATE. check-historical-flag-validity.mjs
      # gates layer 1 of the flag resolution against that date, the way
      # check-historical-flag-anachronism.mjs gates the modern-flag borrows.
      - "scripts/check-historical-flag-validity.mjs"
      - "src/data/historicalFlagValidity.ts"
      - "scripts/check-era-coastline-layer.mjs"
      - "scripts/audit-era-names.mjs"
      - "scripts/download-era-flags.mjs"
      - "scripts/data/era-flag-sources.json"
      # Why a polity shows no flag is a claim the panel makes about history; this
      # check keeps it curated rather than guessed (and keeps the registry free of
      # duplicate keys, which silently shadow curated entries).
      - "scripts/check-era-flag-explanations.mjs"
      # A polity's continent is where its LAND is. The grid used to fall back to the
      # continent of whichever country the polity borrowed its flag from, filing every
      # 1914 colony under its ruler's continent, and dropped polities with no region
      # label into an "Other" heading.
      - "scripts/check-era-continents.mjs"
      - "scripts/build-polity-continents.mjs"
      - "scripts/lib/polity-geography.mjs"
      - "src/data/polityContinents.ts"
      - "src/lib/flagList.ts"
      - "src/lib/continentGroups.ts"
      - "src/pages/LearnPage.tsx"
      # The era renderer draws the coastline basemap under every era, so land no
      # polity covers still reads as land rather than ocean (the "Greece looked like
      # an island" bug). A change here can break the coastline without touching data.
      - "src/components/HistoricalMap.tsx"
      # Every <img> the app renders must be keyed by its own src, so switching
      # what an image slot shows mounts a FRESH element instead of re-pointing a
      # live one (which keeps painting the previous picture and inherits the
      # imperative onError state that blanks a tile).
      - "scripts/check-image-element-keys.mjs"
      - "scripts/check-user-facing-copy.mjs"
      - "scripts/lib/userFacingCopy.mjs"
      - "src/components/**"
      - "src/pages/**"

jobs:
  check-proportions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify flag aspect ratios
        run: node scripts/check-flag-proportions.mjs

      - name: Verify every renderable subdivision has a SUBDIVISION_META entry
        run: node scripts/check-subdivision-meta-coverage.mjs

      # 2026-09 subnational flag audit: ~350 flags were served from the jsDelivr
      # CDN (which intermittently 403/404s) although the files were bundled, and
      # "suppressed" wrong flags kept their files. Every subdivision flag must be a
      # bundled, correctly-typed file; a suppressed code must have none.
      - name: Verify every subdivision flag is bundled, indexed and correctly typed
        run: node scripts/check-subdivision-flags-bundled.mjs

      - name: Verify the hierarchy table's type-colour palette has enough colours for every country
        run: node scripts/check-hierarchy-type-colors.mjs

      - name: Verify every merged disputed territory is a complete subdivision of its claimant
        run: node scripts/check-disputed-territory-coverage.mjs

      - name: Verify no population figure predates its country's latest enumeration
        run: node scripts/check-population-freshness.mjs

      # This one had never run in CI, and it was RED: 34 era flags bundled during
      # the era audit were missing from flagOverlayAspectRatios.ts, so Nepal's and
      # Mongolia's pennants and the 3:1 Persia/Montenegro flags shipped to the live
      # site at the default ratio.
      - name: Verify the flag aspect-ratio table covers every bundled flag
        run: node scripts/build-flag-aspect-ratios.mjs --check

      - name: Verify every <img> is keyed by its src (no stale/blanked images)
        run: node scripts/check-image-element-keys.mjs

      - name: Verify noImageReason never leaks Wikidata codes / URLs / agent jargon
        run: node scripts/check-user-facing-copy.mjs

      - name: Verify RSF World Press Freedom Index 2026 data matches the official CSV
        run: node scripts/check-rsf-press-freedom.mjs

      - name: Verify UNDP Human Development Index 2023 data matches the official extract
        run: node scripts/check-hdi-data.mjs

      - name: Verify WEF Global Gender Gap Index 2026 data matches the official extract
        run: node scripts/check-gggr-data.mjs

      - name: Verify IEP Global Peace Index 2026 data matches the official extract
        run: node scripts/check-gpi-data.mjs

      - name: Verify Passport Index visa-access matrix matches the bundled extract
        run: node scripts/check-visa-access.mjs

      - name: Verify UN DESA diaspora migrant-stock matrix matches the bundled extract
        run: node scripts/check-diaspora.mjs

      - name: Verify Freedom House Freedom in the World 2026 data matches the official extract
        run: node scripts/check-fiw-data.mjs

      - name: Verify IEP Global Terrorism Index 2026 data matches the official extract
        run: node scripts/check-gti-data.mjs

      - name: Verify World Happiness Report 2026 data matches the official extract
        run: node scripts/check-whr-happiness.mjs

      - name: Check Lowy Global Diplomacy Index data
        run: node scripts/check-gdi-data.mjs

      - name: Verify WJP Rule of Law Index 2025 data matches the official CSVs
        run: node scripts/check-wjp-rule-of-law.mjs

      - name: Verify IMD World Competitiveness Ranking 2025 data matches the official extract
        run: node scripts/check-imd-wcr.mjs

      - name: Verify IEP Ecological Threat Index 2024 data matches the official extract
        run: node scripts/check-etr-data.mjs

      - name: Verify Brand Finance Global Soft Power Index 2026 data matches the official extract
        run: node scripts/check-soft-power-data.mjs

      - name: Verify Reuters Digital News Report 2026 trust index matches the official extract
        run: node scripts/check-dnr-trust.mjs

      - name: Verify chart country-blocks filter data and OR wiring
        run: node scripts/check-country-blocks.mjs

      - name: Verify World Values Survey results wiring (incl. Joint EVS/WVS France)
        run: node scripts/check-wvs-results.mjs

      - name: Verify the precomputed world sub-national borders mesh is up to date
        run: node scripts/build-world-subnational-borders.mjs --check

      - name: Verify every flags:check gate actually runs in CI
        run: node scripts/check-ci-coverage.mjs

  check-parent-collision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # sharp is required to rasterise the flags for perceptual comparison.
      - name: Install dependencies
        run: npm ci

      - name: Verify no subdivision flag duplicates its parent nation's flag
        run: node scripts/check-parent-flag-collision.mjs

      - name: Verify no same-name subdivision in another country has a near-identical flag
        run: node scripts/check-subdivision-name-collisions.mjs

      - name: Verify no bundled flag is a degraded thumbnail or near-blank stub
        run: node scripts/check-flag-image-quality.mjs

      - name: Verify no capital-city flag duplicates its country's national flag
        run: node scripts/check-capital-flags.mjs

      - name: Verify no capital-city flag duplicates its own subdivision's flag
        run: node scripts/check-capital-subdivision-collision.mjs

      # A quiz flag shared by two divisions must accept both answers.
      - name: Verify every near-identical pair of division flags is declared or reviewed
        run: node scripts/check-identical-subdivision-flags.mjs

      # Needs sharp, so it lives here rather than in check-proportions.
      - name: Verify no raster flag has a transparent border
        run: node scripts/trim-flag-transparency.mjs --check

  check-era-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # restore-era-geometry.mjs --check compares each era map against the commit it
        # was imported at, so the job needs history, not just the tip.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: check-historical-maps.mjs imports src/lib/historicalEras.ts
          # directly for DISPLAY_NAME_FIXES, which needs Node's native TypeScript
          # type-stripping (22.18+). On Node 20 it dies with ERR_UNKNOWN_FILE_EXTENSION.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify era-map geometry, provenance and encoding
        run: node scripts/check-historical-maps.mjs

      - name: Verify no era map's geometry has drifted from the authoritative import
        run: node scripts/restore-era-geometry.mjs --check

      - name: Verify no era polygon has been drawn past the coastline
        run: node scripts/check-era-landmass.mjs

      - name: Verify no polity appears on a map that predates or postdates it
        run: node scripts/check-era-anachronism.mjs

      - name: Verify no era shows a curated flag outside its sourced date range
        run: node scripts/check-historical-flag-validity.mjs

      # The modern-flag half of the same gate (South Africa's 1994 flag on the 1914
      # map). It was named in this workflow's paths: filter and in a comment, but no
      # step ever ran it — a filter is a trigger, not a gate. It imports a .ts module,
      # so it must stay in this Node 24 job.
      - name: Verify no era borrows a modern flag that postdates it
        run: node scripts/check-historical-flag-anachronism.mjs

      - name: Verify unmapped land still renders as land in every era
        run: node scripts/check-era-coastline-layer.mjs

      - name: Verify every bundled era flag still matches its recorded source
        run: node scripts/download-era-flags.mjs --check

      - name: Verify every withheld era flag explains itself
        run: node scripts/check-era-flag-explanations.mjs

      # The "National flags" tab shares its historical flag IMAGES and their sourced
      # from/to windows with the era maps, so this check imports historicalFlagValidity.ts
      # and belongs in this Node 24 job: it fails the build if the two ever date the same
      # file differently, if a flag is not bundled, or if the generated data has drifted
      # from the curated manifest.
      - name: Verify the national-flags tab is sourced, bundled and agrees with the eras
        run: node scripts/check-national-flags.mjs

      # Football-association crests always show sourced World Cup appearance +
      # title rows in the Learn panel. This fails if a crest loses its record,
      # if titles drift from worldCupTitles.ts, or if LearnPage /
      # NationalFlagDetails stop calling withFootballCrestStats.
      - name: Verify football-crest World Cup records stay on the panel
        run: node scripts/check-football-crest-stats.mjs

      # Measures each polity's own polygons against the bundled basemap, so it needs the
      # same Node 24 that can load historicalEras.ts directly.
      - name: Verify every polity is filed on a continent its own land is on
        run: node scripts/check-era-continents.mjs

      # Flag Master's symbol packs (coats of arms, passports, football crests, former
      # flags, service flags, meanings) are built from the same national-symbols data
      # this job already validates, and the deck builders import it directly — so this
      # check lives in the Node 24 job too. It fails the build if a quiz question could
      # have more than one correct answer, if the current national flag leaked into
      # another pack, if a deck went empty, or if the deck builders stopped being wired
      # into the game.
      - name: Verify every quiz symbol deck has one answer per question
        run: node scripts/check-quiz-symbol-decks.mjs

      # Shared green→red index map palette. Imports democracyColors.ts, so it
      # belongs in this Node 24 job. Fails if any index invents its own colours
      # or drifts from indexBandColors(INDEX_MAP_PALETTE).
      - name: Verify every index map samples the shared INDEX_MAP_PALETTE
        run: node scripts/check-index-map-colors.mjs

      # Universal index labelling: thematic groups, no "Global", always
      # "{name}, {year} ({publisher})". Imports democracyColors.ts + countryFacts.
      - name: Verify every index label uses DEMOCRACY_INDEX_META
        run: node scripts/check-index-labels.mjs

      # Every country sits inside a chart band naming its own category (V-Dem /
      # Freedom House use observed, possibly overlapping ranges). Imports .ts.
      - name: Verify index chart bands match every country's category
        run: node scripts/check-index-chart-bands.mjs

      # World Values Survey Wave 7 extract + Learn-mode map/chart/widget wiring.
      - name: Verify WVS results data and Learn-mode wiring
        run: node scripts/check-wvs-results.mjs

      # Country Personas: src/data/countryPersonas.ts must match the frozen model exactly (core
      # values recomputed, the 1-SD boundary held, every quoted figure re-derived from the
      # snapshot), and the data, copy lint, colours and UI wiring must hold. The check imports
      # .ts modules, so both run in this Node 24 job.
      - name: Verify Country Personas reproduce the frozen model
        run: node scripts/build-country-personas.mjs --check
      - name: Verify Country Personas data, copy and UI wiring
        run: node scripts/check-country-personas.mjs

  check-flag-meanings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Several of the checks below (news agencies, newspapers, airlines, …)
      # import sharp for image sniffing — without npm ci the job fails with
      # ERR_MODULE_NOT_FOUND before asserting anything.
      - name: Install dependencies
        run: npm ci

      - name: Verify every flag-meaning entry is sourced and well-formed
        run: node scripts/check-flag-meanings.mjs

      - name: Verify every city-flag-meaning entry is sourced and well-formed
        run: node scripts/check-city-flag-meanings.mjs

      - name: Verify every political party is sourced, bundled and well-formed
        run: node scripts/check-political-parties.mjs

      - name: Verify every commercial airline is sourced, bundled and well-formed
        run: node scripts/check-commercial-airlines.mjs

      - name: Verify every tourism logo is sourced, bundled and well-formed
        run: node scripts/check-tourism-logos.mjs

      - name: Check central bank logos
        run: node scripts/check-central-banks.mjs

      - name: Verify every national news agency is sourced, bundled and well-formed
        run: node scripts/check-national-news-agencies.mjs

      - name: Verify every national newspaper is sourced, bundled and well-formed
        run: node scripts/check-national-newspapers.mjs

