    <title>Guess the Country Flag</title>
    <!-- Owner renamed GitHub → wlad-c. Old Pages host 404s for network
         fetches, but an installed PWA / cached SW can still serve this
         shell from the old origin — bounce those sessions to the live
         site before the app boots. -->
    <script>
      if (location.hostname === "wladimirchagas.github.io") {
        location.replace(
          "https://wlad-c.github.io" +
            location.pathname +
            location.search +
            location.hash,
        );
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
